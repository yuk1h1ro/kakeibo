<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!--
      多層防御の CSP。いま XSS の入口はコード上1つも無い(dangerouslySetInnerHTML も
      innerHTML も使っていない)が、後から1つ増えたときの被害を抑える保険として置く。

      外部に出る通信はこの4つだけ:
        https://*.supabase.co                     … データ(REST と Realtime の wss)
        https://generativelanguage.googleapis.com … レシート読み取り (Gemini)
        https://discord.com                       … 通知の webhook
        https://aistudio.google.com               … リンクを開くだけ(通信はしない)

      注意点:
        - GitHub Pages はレスポンスヘッダを足せないので meta で入れる。
          そのため frame-ancestors は書いていない(meta では効かないため)。
        - style-src の 'unsafe-inline' は React の style={{...}}(要素の style 属性)に要る。
        - img-src の blob: は、レシート写真を <img> 経由で読む古いブラウザ向けの
          フォールバック (receiptScan.ts の loadBitmap) に要る。
        - script-src は 'self' だけ。PWA の登録スクリプトは外部ファイル
          (registerSW.js)なので、インラインを許さなくても動く。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://generativelanguage.googleapis.com https://discord.com"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="家計簿" />
    <title>家計簿</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
